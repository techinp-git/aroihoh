services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: aroihoh-postgres
    environment:
      POSTGRES_USER: aroihoh
      POSTGRES_PASSWORD: aroihoh
      POSTGRES_DB: aroihoh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aroihoh"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aroihoh-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
