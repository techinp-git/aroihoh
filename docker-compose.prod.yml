# AroiHoh production stack (Hetzner Cloud) — API + Postgres(PostGIS)
# Caddy อยู่บน host แล้ว (คนละ project) → reverse_proxy มาที่ 127.0.0.1:3000
# static (LIFF/Admin) เสิร์ฟผ่าน Caddy เดิม (ดู deploy/Caddyfile.snippet)
#
# ใช้:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: aroihoh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ไม่เปิด ports ออกนอก — เข้าถึงได้แค่ผ่าน docker network ภายใน (ปลอดภัย)
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aroihoh-api
    restart: unless-stopped
    env_file: .env.prod
    environment:
      # รูปแชตจากลูกค้าเก็บใน volume นี้ (persist ข้าม rebuild) — ต้องตรงกับ MEDIA_DIR
      MEDIA_DIR: /app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - mediadata:/app/media
    # เปิดเฉพาะ localhost ของ host → Caddy บน host วิ่งเข้ามาได้ แต่โลกภายนอกเข้าตรงไม่ได้
    ports:
      - '127.0.0.1:3000:3000'

  # US-09: คิว push LINE (BullMQ) — ต้องตั้ง REDIS_URL=redis://redis:6379 ใน .env.prod ด้วย
  # ไม่ตั้ง = API จะ fallback เป็นโหมด inline (ส่งทันที ไม่มี retry) แบบเงียบ ๆ
  redis:
    image: redis:7-alpine
    container_name: aroihoh-redis
    restart: unless-stopped
    # ไม่เปิด ports ออกนอก — เข้าถึงได้แค่ผ่าน docker network ภายใน
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  mediadata:
